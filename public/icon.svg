<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Outer Orbit Rings -->
  <circle cx="256" cy="256" r="160" stroke="#3f3f46" stroke-width="6" stroke-dasharray="16 8" fill="none" opacity="0.6"/>
  <circle cx="256" cy="256" r="120" stroke="#52525b" stroke-width="4" fill="none" opacity="0.4"/>
  
  <!-- Drift Curve Arc -->
  <path d="M 176 336 C 192 240, 320 272, 336 176" stroke="url(#ring)" stroke-width="16" stroke-linecap="round" fill="none" filter="url(#glow)"/>
  
  <!-- Intention Point (Amber) -->
  <circle cx="176" cy="336" r="18" fill="#f59e0b" filter="url(#glow)"/>
  <circle cx="176" cy="336" r="8" fill="#ffffff"/>

  <!-- Reality Point (Emerald) -->
  <circle cx="336" cy="176" r="18" fill="#10b981" filter="url(#glow)"/>
  <circle cx="336" cy="176" r="8" fill="#ffffff"/>

  <!-- Central Compass Pivot -->
  <circle cx="256" cy="256" r="10" fill="#a1a1aa"/>
</svg>
